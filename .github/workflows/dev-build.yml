name: Dev Build

# builds feature branches and keeps the jar as a run artifact; releases only ever come from build.yml on main
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      # artifacts can't be fetched from every network, so the result also goes to a throwaway branch
      - name: Publish result to ci-builds
        if: always()
        shell: bash
        run: |
          mkdir out
          cp build.log out/ || true
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)" out/aether-dev.jar
          fi
          echo "${{ github.sha }} ${{ github.ref_name }} ${{ steps.build.outcome }}" > out/BUILD
          cd out
          git init -q -b ci-builds
          git config user.name "aether-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build of ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-builds
